<!-- ================= 1-CLICK MERGE OLD SPLIT BOOKS ================= -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const btn = document.createElement('button');
        btn.id = 'mergeSplitBooksBtn';
        btn.innerHTML = '🔧 အပိုင်းခွဲစာအုပ်များ တစ်ဖိုင်တည်းပေါင်းမည်';
        btn.className = 'fixed bottom-6 right-6 z-50 px-5 py-3 rounded-full bg-amber-500 text-[#0D0F14] font-bold shadow-2xl hover:scale-105 transition-transform text-sm';
        btn.onclick = executeMergeProcess;
        document.body.appendChild(btn);
      }, 2000); // UI ပွင့်ပြီး ၂ စက္ကန့်အကြာတွင် ညာဘက်အောက်ထောင့်၌ ပေါ်လာပါမည်
    });

    async function executeMergeProcess() {
      if (typeof booksData === 'undefined' || !supabaseClient) {
        return alert('စာအုပ် Data များ ရယူနေဆဲပါ။ ခဏစောင့်ပြီးမှ ပြန်နှိပ်ပါ။');
      }

      // #parts= ပါသော အပိုင်းခွဲစာအုပ်များကို စစ်ထုတ်ခြင်း
      const chunkedBooks = booksData.filter(b => b.pdf_url && b.pdf_url.includes('#parts='));
      
      if (chunkedBooks.length === 0) {
        return alert('✅ အပိုင်းခွဲထားသော စာအုပ်အဟောင်းများ မရှိတော့ပါ။ အားလုံး Single PDF ဖြစ်နေပါပြီ!');
      }

      const confirmMsg = `အပိုင်းခွဲစာအုပ်ဟောင်း (${chunkedBooks.length}) အုပ် တွေ့ရှိပါသည်။\nဖိုင်တစ်ဖိုင်တည်း (Single PDF) အဖြစ် အလိုအလျောက် ပြောင်းလဲပြီး အသစ်ပြန်တင်မလား?`;
      if (!confirm(confirmMsg)) return;

      const btn = document.getElementById('mergeSplitBooksBtn');
      const originalText = btn.innerHTML;
      btn.disabled = true;

      let successCount = 0;

      for (let i = 0; i < chunkedBooks.length; i++) {
        const book = chunkedBooks[i];
        try {
          btn.innerHTML = `⏳ (${i+1}/${chunkedBooks.length}) "${book.title}" ပေါင်းနေသည်...`;
          
          const oldUrl = book.pdf_url;
          const [part0Url, countStr] = oldUrl.split('#parts=');
          const totalParts = parseInt(countStr, 10) || 1;
          const prefix = part0Url.replace(/\.part0$/, '');

          // 1. အပိုင်းများအားလုံးကို Download ဆွဲယူခြင်း
          const buffers = [];
          for (let p = 0; p < totalParts; p++) {
            btn.innerHTML = `⏳ (${i+1}/${chunkedBooks.length}) အပိုင်း (${p+1}/${totalParts}) ဆွဲယူနေသည်...`;
            const res = await fetch(`${prefix}.part${p}`);
            if (!res.ok) throw new Error(`အပိုင်း ${p} ကို ယူ၍မရပါ`);
            buffers.push(await res.arrayBuffer());
          }

          // 2. ဖိုင်တစ်ဖိုင်တည်း ပေါင်းခြင်း
          btn.innerHTML = `⏳ (${i+1}/${chunkedBooks.length}) ဆာဗာသို့ ပြန်တင်နေသည်...`;
          const mergedBlob = new Blob(buffers, { type: 'application/pdf' });
          const fileName = `merged_${Date.now()}_${book.id}.pdf`;

          // 3. GitHub သို့ ပြန်တင်ခြင်း (admin.html တွင် ရှိပြီးသား uploadViaGitBlobApi ကို အသုံးပြုမည်)
          const newPdfUrl = await uploadViaGitBlobApi(mergedBlob, fileName, 'pdfs');

          // 4. Supabase Database အား Update လုပ်ခြင်း
          btn.innerHTML = `⏳ (${i+1}/${chunkedBooks.length}) Database Update လုပ်နေသည်...`;
          await supabaseClient.from('books').update({ pdf_url: newPdfUrl }).eq('id', book.id);
          
          // 5. GitHub မှ အဟောင်းများ ဖျက်ခြင်း (Optional - ရှိပြီးသား deleteFilesFromGitHubByUrls ကို သုံးမည်)
          try {
            if (typeof deleteFilesFromGitHubByUrls === 'function') {
               await deleteFilesFromGitHubByUrls([oldUrl]);
            }
          } catch(e) { console.log('Old file deletion skipped'); }
          
          successCount++;
        } catch (err) {
          console.error(err);
          alert(`"${book.title}" ပြောင်းလဲခြင်း မအောင်မြင်ပါ: ${err.message}`);
        }
      }

      btn.innerHTML = `✅ ပြီးပါပြီ (${successCount} အုပ်)`;
      setTimeout(() => { btn.style.display = 'none'; }, 3000);
      
      alert(`🎉 အောင်မြင်ပါသည်။ စာအုပ်ဟောင်း (${successCount}) အုပ်ကို ဖိုင်တစ်ဖိုင်တည်း (Single PDF) သို့ အလိုအလျောက် ပြောင်းလဲပြီးပါပြီ!\n\nယခု User App သို့ သွား၍ စာအုပ်ကို ပြန်ဖွင့်ကြည့်ပါ။ Loading ချက်ချင်းပွင့်သွားပါမည်။`);
      
      // စာအုပ်စာရင်း အသစ်ပြန်ခေါ်ရန်
      if (typeof loadAllAdminData === 'function') loadAllAdminData();
    }
  </script>
